<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Curated battery safety & energy storage literature. Browse by category, click through to the source.">
<title>Battery & Energy Storage Literature</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f6f7f9; --panel-2:#eceef1; --line:#dde1e6;
    --ink:#1a1f26; --ink-dim:#5b6570; --ink-faint:#8a94a0;
    --accent:#0f8f8a; --accent-ink:#ffffff;
    --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --r:6px;
  }
  .chem-lithium-ion{--c:#4c8bf5} .chem-sodium-ion{--c:#f5a04c} .chem-lithium-metal{--c:#8b7cf5}
  .chem-solid-state{--c:#4cc4c0} .chem-lithium-sulfur{--c:#c99f00} .chem-lead-acid{--c:#9aa7b4}
  .chem-flow{--c:#4cd6b0} .chem-potassium-ion{--c:#c0507e} .chem-other{--c:#68737f}

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
  @media (max-width:820px){.app{grid-template-columns:1fr}.sidebar{position:static;border-right:none;border-bottom:1px solid var(--line)}}

  .sidebar{background:var(--panel);border-right:1px solid var(--line);padding:18px 16px 40px;
    position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto}
  .brand h1{font-size:16px;font-weight:650;margin:2px 2px 2px}
  .brand p{margin:0 2px 16px;color:var(--ink-faint);font-size:12px;line-height:1.5}
  .stamp{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin:0 2px 18px}
  .facet{margin-bottom:20px}
  .facet h3{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ink-faint);margin:0 0 8px 2px;display:flex;justify-content:space-between}
  .facet h3 button{font:inherit;background:none;border:none;color:var(--accent);cursor:pointer;
    text-transform:none;letter-spacing:0;padding:0;font-size:10.5px;visibility:hidden}
  .facet.has-active h3 button{visibility:visible}
  .opt{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:var(--r);cursor:pointer;color:var(--ink-dim)}
  .opt:hover{background:var(--panel-2);color:var(--ink)}
  .opt.on{background:var(--panel-2);color:var(--ink)}
  .opt .dot{width:8px;height:8px;border-radius:2px;background:var(--c,var(--ink-faint));flex:none}
  .opt .lab{flex:1;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .opt .ct{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}

  .main{overflow-y:auto}
  .topbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .search{position:relative;flex:1;min-width:200px;max-width:480px}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;
    fill:none;stroke:var(--ink-faint)}
  .search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:9px 12px 9px 34px;font:inherit;color:var(--ink)}
  .count{font-family:var(--mono);font-size:12px;color:var(--ink-faint);white-space:nowrap}
  .list{padding:16px 22px 60px;display:flex;flex-direction:column;gap:10px}
  .card{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    background:var(--panel);text-decoration:none;color:inherit}
  .card:hover{border-color:var(--c,var(--ink-faint));text-decoration:none}
  .card .spine{width:4px;background:var(--c,var(--ink-faint));flex:none}
  .card .body{padding:14px 16px;flex:1;min-width:0}
  .card .t{font-size:14.5px;font-weight:600;margin:0 0 6px;color:var(--ink);line-height:1.4}
  .card .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-dim);margin-bottom:6px}
  .card .chem{color:var(--c);font-weight:600}
  .card .tags{display:flex;flex-wrap:wrap;gap:5px}
  .card .tag{font-family:var(--mono);font-size:10.5px;background:var(--panel-2);color:var(--ink-dim);
    padding:2px 7px;border-radius:4px}
  .card .go{align-self:center;padding:0 16px;color:var(--ink-faint);font-family:var(--mono);font-size:12px;flex:none}
  .empty{padding:80px 22px;text-align:center;color:var(--ink-faint)}
  .empty .big{font-size:16px;color:var(--ink-dim)}
  .loading{padding:80px;text-align:center;color:var(--ink-faint);font-family:var(--mono)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>Battery &amp; Energy Storage Literature</h1>
      <p>A curated reading list for battery safety &amp; energy storage research. Click a paper to open its source.</p>
    </div>
    <div class="stamp" id="stamp">loading…</div>
    <div id="facets"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="search">
        <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Search title, author, tag…" autocomplete="off">
      </div>
      <div class="count" id="count"></div>
    </div>
    <div class="list" id="list"><div class="loading">Loading library…</div></div>
  </main>
</div>

<script>
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const CHEM_CLASS = c => "chem-" + String(c||"other").toLowerCase().replace(/[^a-z0-9]+/g,"-");
let DATA=null, PAPERS=[], STATE={q:"", filters:{chemistry:new Set(), tags:new Set()}};

const FACET_DEFS = [
  {key:"chemistry", label:"Chemistry", chem:true},
  {key:"tags", label:"Tags", limit:24},
];

async function boot(){
  try{
    const r = await fetch("papers.json");
    if(!r.ok) throw new Error(r.status);
    DATA = await r.json();
  }catch(e){
    document.getElementById("list").innerHTML =
      '<div class="empty"><p class="big">Couldn\'t load the library</p><p>papers.json must sit next to index.html.</p></div>';
    return;
  }
  // Public list only includes papers with a real place to send someone —
  // a title with nowhere to click isn't useful here.
  PAPERS = DATA.papers.filter(p => (p.web_link||"").trim() || (p.doi||"").trim());
  const d = new Date(DATA.generated_at);
  document.getElementById("stamp").textContent =
    PAPERS.length + " papers · updated " + (isNaN(d)? "—" : d.toISOString().slice(0,10));
  buildFacets();
  bind();
  render();
}

function buildFacets(){
  const counts = {chemistry:{}, tags:{}};
  for(const p of PAPERS){
    const c = String(p.chemistry||"").trim(); if(c) counts.chemistry[c]=(counts.chemistry[c]||0)+1;
    for(const t of (p.tags_list||[])) if(!t.startsWith("chem:")) counts.tags[t]=(counts.tags[t]||0)+1;
  }
  const host = document.getElementById("facets");
  host.innerHTML = "";
  for(const def of FACET_DEFS){
    let opts = Object.entries(counts[def.key]).sort((a,b)=>b[1]-a[1]);
    if(def.limit) opts = opts.slice(0, def.limit);
    if(!opts.length) continue;
    const wrap = document.createElement("div");
    wrap.className = "facet"; wrap.dataset.key = def.key;
    wrap.innerHTML = `<h3>${def.label}<button data-clear="${def.key}">clear</button></h3>`;
    for(const [val,ct] of opts){
      const el = document.createElement("div");
      el.className = "opt " + (def.chem?CHEM_CLASS(val):"");
      el.dataset.key = def.key; el.dataset.val = val;
      el.innerHTML = `<span class="dot"></span><span class="lab">${esc(val)}</span><span class="ct">${ct}</span>`;
      wrap.appendChild(el);
    }
    host.appendChild(wrap);
  }
}

function bind(){
  document.getElementById("facets").addEventListener("click",e=>{
    const opt = e.target.closest(".opt");
    const clr = e.target.closest("[data-clear]");
    if(clr){ STATE.filters[clr.dataset.clear].clear(); render(); return; }
    if(opt){
      const s = STATE.filters[opt.dataset.key];
      s.has(opt.dataset.val) ? s.delete(opt.dataset.val) : s.add(opt.dataset.val);
      render();
    }
  });
  const q = document.getElementById("q");
  q.addEventListener("input",()=>{STATE.q=q.value.trim().toLowerCase();render();});
}

function matches(p){
  if(STATE.q){
    const blob = [(p.title||""),(p.all_authors||""),(p.tags||"")].join(" ").toLowerCase();
    for(const t of STATE.q.split(/\s+/).filter(Boolean)) if(!blob.includes(t)) return false;
  }
  if(STATE.filters.chemistry.size && !STATE.filters.chemistry.has(String(p.chemistry||""))) return false;
  if(STATE.filters.tags.size){
    const tl=new Set(p.tags_list||[]);
    for(const t of STATE.filters.tags) if(!tl.has(t)) return false;
  }
  return true;
}

function render(){
  const rows = PAPERS.filter(matches);
  document.querySelectorAll(".facet").forEach(f=>{
    const key=f.dataset.key, s=STATE.filters[key];
    f.classList.toggle("has-active", s.size>0);
    f.querySelectorAll(".opt").forEach(o=>o.classList.toggle("on", s.has(o.dataset.val)));
  });
  document.getElementById("count").innerHTML = `<b>${rows.length}</b> of ${PAPERS.length}`;
  const host = document.getElementById("list");
  if(!rows.length){
    host.innerHTML = '<div class="empty"><p class="big">No papers match</p><p>Try removing a filter or broadening your search.</p></div>';
    return;
  }
  host.innerHTML = rows.map(cardHTML).join("");
}

function cardHTML(p){
  const href = (p.web_link||"").trim() || "https://doi.org/"+encodeURI(String(p.doi).trim());
  const tags = (p.tags_list||[]).filter(t=>!t.startsWith("chem:")).slice(0,5)
    .map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  const yr = p.year?esc(p.year):"—";
  const venue = p.journal_venue?esc(p.journal_venue):"";
  return `<a class="card ${CHEM_CLASS(p.chemistry)}" href="${esc(href)}" target="_blank" rel="noopener">
    <div class="spine"></div>
    <div class="body">
      <p class="t">${esc(p.title)}</p>
      <div class="meta">
        <span class="chem">${esc(p.chemistry)}</span>
        <span>${yr}</span>
        ${venue?`<span>${venue}</span>`:""}
      </div>
      ${tags?`<div class="tags">${tags}</div>`:""}
    </div>
    <div class="go">Read ↗</div>
  </a>`;
}

boot();
</script>
</body>
</html>
